name: Format public Trainer API
on:
  push:
    branches: [feat/public-trainer-api]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-trainer-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.11,<1'
      - run: ruff format src/starlings/trainer.py src/starlings/remote.py src/starlings/__init__.py tests/test_trainer_api.py tests/test_remote.py
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-public-trainer-api.yml
          git add src/starlings/trainer.py src/starlings/remote.py src/starlings/__init__.py tests/test_trainer_api.py tests/test_remote.py
          git commit -m 'style(sdk): format public Factor API'
          git push origin HEAD:feat/public-trainer-api
